    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("daemonstate-theme");
          const hasStoredTheme = storedTheme === "light" || storedTheme === "dark";
          const theme = hasStoredTheme ? storedTheme : "dark";

          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          document.getElementById("theme-color")?.setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
