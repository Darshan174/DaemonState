    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("daemonstate-theme");
          const hasStoredTheme = storedTheme === "light" || storedTheme === "dark";
          const theme = hasStoredTheme ? storedTheme : "dark";

          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          document.getElementById("theme-color")?.setAttribute("content", theme === "dark" ? "#000000" : "#ffffff");
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

  <body class="antialiased">
    <div id="root"></div>
