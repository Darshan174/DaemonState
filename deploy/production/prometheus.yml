global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: daemonstate-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer_token
    static_configs:
      - targets:
          - app:8000

  - job_name: daemonstate-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9101
